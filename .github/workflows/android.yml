name: DIABLO SCANNER BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Diablo Scanner with Vision AI
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Diablo Scanner
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: |
          set -e
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Download AI models
        run: |
          set -e

          mkdir -p app/src/main/assets/models

          curl -fL --retry 3 \
            "https://huggingface.co/ggml-org/SmolVLM-256M-Instruct-GGUF/resolve/main/SmolVLM-256M-Instruct-Q8_0.gguf" \
            -o app/src/main/assets/models/diablo-text-model.gguf

          curl -fL --retry 3 \
            "https://huggingface.co/ggml-org/SmolVLM-256M-Instruct-GGUF/resolve/main/mmproj-SmolVLM-256M-Instruct-Q8_0.gguf" \
            -o app/src/main/assets/models/diablo-image-projector.gguf

          test -s app/src/main/assets/models/diablo-text-model.gguf
          test -s app/src/main/assets/models/diablo-image-projector.gguf

          ls -lh app/src/main/assets/models/

      - name: Download llama.cpp
        run: |
          git clone --depth 1 \
            https://github.com/ggml-org/llama.cpp.git \
            llama.cpp

      - name: Build and package Android AI engine
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/jniLibs/armeabi-v7a

          for ABI in arm64-v8a armeabi-v7a; do
            echo "Building llama.cpp for $ABI"

            cmake -S llama.cpp -B "llama.cpp/build-$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_SHARED_LIBS=OFF \
              -DGGML_NATIVE=OFF \
              -DGGML_OPENMP=OFF \
              -DGGML_LLAMAFILE=OFF \
              -DGGML_CUDA=OFF \
              -DLLAMA_OPENSSL=OFF \
              -DLLAMA_BUILD_TESTS=OFF \
              -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_SERVER=OFF \
              -DLLAMA_BUILD_APP=OFF \
              -DLLAMA_BUILD_TOOLS=ON \
              -DLLAMA_BUILD_UI=OFF

            cmake --build "llama.cpp/build-$ABI" \
              --target llama-mtmd-cli \
              --config Release \
              -j2

            BIN="llama.cpp/build-$ABI/bin/llama-mtmd-cli"

            if [ ! -s "$BIN" ]; then
              echo "ERROR: AI engine missing for $ABI"
              exit 1
            fi

            cp "$BIN" \
              "app/src/main/jniLibs/$ABI/libdiablo_llama.so"

            chmod 755 \
              "app/src/main/jniLibs/$ABI/libdiablo_llama.so"

            ls -lh \
              "app/src/main/jniLibs/$ABI/libdiablo_llama.so"
          done

      - name: Verify bundled AI files
        run: |
          set -e

          test -s app/src/main/assets/models/diablo-text-model.gguf
          test -s app/src/main/assets/models/diablo-image-projector.gguf
          test -s app/src/main/jniLibs/arm64-v8a/libdiablo_llama.so
          test -s app/src/main/jniLibs/armeabi-v7a/libdiablo_llama.so

          echo "AI models and both engine binaries exist."

      - name: Build Android APK
        run: |
          set -e
          gradle --no-daemon assembleDebug

      - name: Verify APK contains AI models
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          unzip -l "$APK" > apk-contents.txt

          grep -q "assets/models/diablo-text-model.gguf" apk-contents.txt
          grep -q "assets/models/diablo-image-projector.gguf" apk-contents.txt
          grep -q "lib/arm64-v8a/libdiablo_llama.so" apk-contents.txt
          grep -q "lib/armeabi-v7a/libdiablo_llama.so" apk-contents.txt

          ls -lh "$APK"
          echo "APK contains the expected AI model and engine files."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diablo-scanner-vision-ai-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
