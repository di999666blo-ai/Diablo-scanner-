name: DIABLO SCANNER BUILD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Diablo Scanner APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Diablo Scanner
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build tools
        run: |
          set -e
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build Android APK
        run: |
          set -e
          gradle --no-daemon assembleDebug
      - name: Verify APK and bundled app resources
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" > apk-contents.txt
          grep -q "classes.dex" apk-contents.txt
          grep -q "res/drawable/ic_diablo_launcher.png" apk-contents.txt
          ls -lh "$APK"
          echo "APK built. No external SmolVLM files are required."
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: diablo-scanner-offline-chart-analyzer-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
