 name: Build DIABLO SCANNER APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android APK with AI libraries
runs-on: ubuntu-latest
timeout-minutes: 60

steps:
  - name: Download DIABLO project
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle 8.7
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.7'

  - name: Install Android SDK tools
    uses: android-actions/setup-android@v3
    with:
      packages: platform-tools

  - name: Install Android NDK and CMake
    run: |
      sdkmanager --install \
        "ndk;27.2.12479018" \
        "cmake;3.31.6"

  - name: Download llama.cpp source
    uses: actions/checkout@v4
    with:
      repository: ggml-org/llama.cpp
      path: llama.cpp

  - name: Configure Android AI engine
    run: |
      cmake -S llama.cpp -B llama.cpp/build \
        -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
        -DANDROID_ABI=arm64-v8a \
        -DANDROID_PLATFORM=android-26 \
        -DCMAKE_BUILD_TYPE=Release \
        -DBUILD_SHARED_LIBS=ON \
        -DGGML_OPENMP=OFF \
        -DGGML_NATIVE=OFF \
        -DGGML_LLAMAFILE=OFF \
        -DLLAMA_BUILD_TESTS=OFF \
        -DLLAMA_BUILD_EXAMPLES=OFF \
        -DLLAMA_BUILD_TOOLS=OFF \
        -DLLAMA_BUILD_SERVER=OFF \
        -DLLAMA_BUILD_APP=OFF \
        -DLLAMA_BUILD_COMMON=OFF \
        -DLLAMA_BUILD_MTMD=ON

  - name: Compile Android AI libraries
    run: |
      cmake --build llama.cpp/build \
        --config Release \
        --parallel 2

  - name: Package AI libraries into Android app
    run: |
      mkdir -p app/src/main/jniLibs/arm64-v8a
      find llama.cpp/build -type f -name "*.so" -exec cp {} app/src/main/jniLibs/arm64-v8a/ \;
      echo "Native AI libraries packaged:"
      ls -lh app/src/main/jniLibs/arm64-v8a
      test -f app/src/main/jniLibs/arm64-v8a/libllama.so
      test -f app/src/main/jniLibs/arm64-v8a/libmtmd.so

  - name: Check project files
    run: |
      test -f settings.gradle
      test -f build.gradle
      test -f app/build.gradle
      test -f app/src/main/AndroidManifest.xml
      echo "DIABLO SCANNER project files found."

  - name: Build Android APK
    run: gradle --no-daemon assembleDebug

  - name: Check APK
    run: |
      test -f app/build/outputs/apk/debug/app-debug.apk
      ls -lh app/build/outputs/apk/debug/app-debug.apk

  - name: Upload DIABLO SCANNER APK
    uses: actions/upload-artifact@v4
    with:
      name: diablo-scanner-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
      retention-days: 7
