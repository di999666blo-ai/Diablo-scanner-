name: Build DIABLO AI Engine

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android AI Libraries
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download DIABLO project
        uses: actions/checkout@v4

      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android NDK and CMake
        run: |
          sdkmanager --install \
            "ndk;27.2.12479018" \
            "cmake;3.31.6"

      - name: Download llama.cpp source
        uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          path: llama.cpp

      - name: Configure Android AI engine
        run: |
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_LLAMAFILE=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_COMMON=OFF \
            -DLLAMA_BUILD_MTMD=ON

      - name: Compile AI libraries
        run: |
          cmake --build llama.cpp/build \
            --config Release \
            --parallel 2

      - name: Check compiled libraries
        run: |
          find llama.cpp/build -type f -name "*.so" -print
          find llama.cpp/build -type f -name "libllama.so" \
            | grep -q .
          find llama.cpp/build -type f -name "libmtmd.so" \
            | grep -q .

      - name: Package AI libraries and headers
        run: |
          mkdir -p ai-engine/include
          mkdir -p ai-engine/lib/arm64-v8a

          find llama.cpp/build -type f -name "*.so" \
            -exec cp {} ai-engine/lib/arm64-v8a/ \;

          cp llama.cpp/include/llama.h \
            ai-engine/include/

          cp llama.cpp/tools/mtmd/mtmd.h \
            ai-engine/include/

          cp -r llama.cpp/ggml/include/. \
            ai-engine/include/

          cd ai-engine
          zip -r ../diablo-ai-engine.zip .

      - name: Upload AI engine
        uses: actions/upload-artifact@v4
        with:
          name: diablo-ai-engine-arm64
          path: diablo-ai-engine.zip
          if-no-files-found: error
          retention-days: 7
