plugins {
    id 'com.android.application'
}

dependencies {
    // Separate inference backend for the future dedicated Kronos ONNX export.
    // This does not alter or replace the existing SmolVLM/llama.cpp runtime.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0'
}

android {
    namespace 'com.diablo.scanner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.diablo.scanner'
        minSdk 26
        targetSdk 28

        versionCode 1
        versionName '1.0'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
