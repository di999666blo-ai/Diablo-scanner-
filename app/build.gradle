plugins {
    id 'com.android.application'
}

android {
    namespace 'com.diablo.scanner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.diablo.scanner'
        minSdk 26
        targetSdk 28

        versionCode 1
        versionName '1.0'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
