<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#02040A"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet"><title>DIABLO - Page 1 Bull Launcher</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;min-height:100%;background:#000}body{display:grid;place-items:center;min-height:100vh;overflow:hidden;font-family:Inter,Arial,sans-serif}.phone{width:min(390px,100vw);height:min(844px,100vh);background:#02040A;border-radius:36px;position:relative;overflow:hidden}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;color:#fff;font-size:14px;font-weight:600}.d-outer{width:148px;height:148px;border-radius:50%;border:3px solid #FF0A1F;box-shadow:0 0 45px rgba(255,10,31,.8),0 0 80px rgba(255,10,31,.4);display:grid;place-items:center;margin:30px auto 0;position:relative}.d-outer::after{content:'';position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(255,10,31,.2)}.d-inner{width:118px;height:118px;border-radius:50%;background:radial-gradient(35% 30% at 30% 28%,#FF3A4C 0%,#B00816 50%,#400008 100%);display:grid;place-items:center;font-family:Inter,Arial,sans-serif;font-weight:900;font-size:68px;color:#fff}
.text{margin-top:32px;text-align:center}.text b{display:block;font-family:Inter,Arial,sans-serif;font-weight:900;letter-spacing:6px}.text b:first-child{font-size:32px;color:#fff}.text b:nth-child(2){font-size:17px;color:#FF0A1F;letter-spacing:9px;margin-top:4px}.text span{font-size:13px;color:#8A9BB8;margin-top:10px;display:block}.bull{position:absolute;bottom:70px;left:0;right:0;height:min(380px,45vh);background:radial-gradient(ellipse at center,rgba(255,10,31,.35) 0%,rgba(120,0,10,.2) 40%,transparent 70%);display:grid;place-items:center}.bull svg{width:min(280px,72vw);height:min(280px,72vw);filter:drop-shadow(0 0 25px rgba(255,10,31,.6))}
.loading{position:absolute;bottom:24px;left:0;right:0;text-align:center}.loading div:first-child{font-family:'JetBrains Mono',monospace;font-size:13px;color:#FF0A1F}.bar{width:220px;height:4px;background:rgba(255,10,31,.15);border-radius:99px;margin:10px auto 0;border:1px solid rgba(255,10,31,.3);overflow:hidden}.fill{height:100%;width:0%;background:#FF0A1F;box-shadow:0 0 10px #FF0A1F;border-radius:99px;transition:width .1s linear}
@media(max-height:700px){.d-outer{width:112px;height:112px;margin-top:12px}.d-inner{width:88px;height:88px;font-size:52px}.text{margin-top:16px}.text b:first-child{font-size:28px}.text b:nth-child(2){font-size:15px}.bull{height:32vh;bottom:56px}.bull svg{width:min(220px,60vw);height:min(220px,60vw)}}
</style></head><body><div class="phone"><div class="status"><span id="clock">10:24</span><span>100%</span></div><div class="d-outer"><div class="d-inner">D</div></div><div class="text"><b>DIABLO</b><b>SCANNER</b><span>Shazam for Trading Charts</span></div><div class="bull">
<svg viewBox="0 0 200 200" fill="none" aria-hidden="true"><path d="M100 30 C120 10 150 30 155 60 C160 90 145 110 130 125 C120 140 110 160 100 180 C90 160 80 140 70 125 C55 110 40 90 45 60 C50 30 80 10 100 30Z" fill="#FF0A1F"/><path d="M55 60 C30 40 10 70 20 90 C35 70 50 60 55 60 M145 60 C170 40 190 70 180 90 C165 70 150 60 145 60" fill="#FF0A1F"/><path d="M100 80 C90 85 85 95 90 105 C95 115 105 115 110 105 C115 95 110 85 100 80" fill="#000"/><circle cx="75" cy="95" r="4" fill="#000"/><circle cx="125" cy="95" r="4" fill="#000"/></svg></div><div class="loading"><div id="txt">Loading... 0%</div><div class="bar"><div class="fill" id="fill"></div></div></div></div>
<script>let p=0,opening=false;const txt=document.getElementById('txt'),fill=document.getElementById('fill');const clock=document.getElementById('clock');try{clock.textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false})}catch(e){}function anim(){if(p<=100){txt.textContent='Loading... '+p+'%';fill.style.width=p+'%';p++;setTimeout(anim,p<30?80:p<70?35:20)}else if(!opening){opening=true;txt.textContent='Opening...';setTimeout(function(){if(window.DiabloSplash&&window.DiabloSplash.openDashboard){window.DiabloSplash.openDashboard()}else{txt.textContent='Opening dashboard…'}},600)}}anim();</script></body></html>
